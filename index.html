<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f2dbd"><title>Мои тренировки</title>
<style>
:root{--p:#6f2dbd;--p2:#9b4de3;--bg:#f7f4fa;--card:#fff;--text:#24212a;--muted:#756d7c;--line:#e6dfee;--ok:#16834b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:10}h1{margin:0;font-size:25px}.sub{margin-top:5px;opacity:.9;font-size:14px}main{max-width:760px;margin:auto;padding:14px}.tabs,.subtabs{display:grid;gap:7px;margin-bottom:13px}.tabs{grid-template-columns:repeat(4,1fr)}.subtabs{grid-template-columns:repeat(2,1fr)}button{border:0;border-radius:12px;padding:12px 9px;font-size:14px;font-weight:700;background:#eadff2;color:#57218b}.tabs button.active,.subtabs button.active,.primary{background:var(--p);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #d8cfe0;border-radius:11px;font-size:16px;background:#fff}.row{display:flex;gap:8px;align-items:center;margin-top:9px}.row input{min-width:0;flex:1}.exercise{border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:11px;background:#fff}.exercise h3{margin:0 0 4px;font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.45}.exgrid{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}.pic{background:#f4eef8;border-radius:12px;min-height:105px;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic svg{width:105px;height:105px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee5f5;color:#5b278d;font-size:12px;font-weight:700;margin:3px 4px 0 0}.hidden{display:none}.saved{color:var(--ok);font-weight:700;margin-top:8px}.search{margin-bottom:10px}.historyitem{padding:10px 0;border-bottom:1px solid var(--line)}.historyitem:last-child{border-bottom:0}.small{font-size:12px;color:var(--muted)}.note{background:#fff7fc;border-left:4px solid #d84b9b;padding:10px;border-radius:8px;font-size:13px}.titleline{display:flex;justify-content:space-between;gap:8px;align-items:center}.empty{padding:20px;text-align:center;color:var(--muted)}ul{margin:7px 0 0 18px;padding:0}
@media(max-width:500px){.tabs button{font-size:12px;padding:10px 5px}.exgrid{grid-template-columns:92px 1fr}.pic{min-height:92px}.pic svg{width:88px;height:88px}}
</style></head><body>
<header><h1>Мои тренировки</h1><div class="sub" id="date"></div></header>
<main>
<div class="tabs"><button class="active" id="tToday" onclick="page('today')">📅 Сегодня</button><button id="tTrain" onclick="page('train')">🏋️ Тренировки</button><button id="tBase" onclick="page('base')">📚 База</button><button id="tHist" onclick="page('hist')">📈 История</button></div>
<section id="todayPage">
<div class="card"><div class="titleline"><h2 style="margin:0">Дневник дня</h2><span class="small" id="savedMsg"></span></div><div class="grid" style="margin-top:12px"><div><label>Вес, кг</label><input id="weight" type="number" step="0.1"></div><div><label>Шаги</label><input id="steps" type="number"></div><div><label>Съедено, ккал</label><input id="eaten" type="number"></div><div><label>Потрачено, ккал</label><input id="burned" type="number"></div><div><label>Белки, г</label><input id="protein" type="number"></div><div><label>Жиры, г</label><input id="fat" type="number"></div><div><label>Углеводы, г</label><input id="carbs" type="number"></div></div><div class="row"><button class="primary" onclick="saveDay()">Сохранить дневник</button><button onclick="clearDay()">Очистить</button></div></div>
<div class="card"><h2 style="margin-top:0">Что делать сегодня</h2><p class="meta">Выбери тренировку во вкладке «Тренировки». Фактический вес и повторения сохраняются на этом телефоне.</p></div></section>
<section id="trainPage" class="hidden"><div class="card"><div class="subtabs"><button class="active" id="aBtn" onclick="showWorkout('A')">Низ A</button><button id="bBtn" onclick="showWorkout('B')">Низ B</button></div><div class="subtabs"><button id="uABtn" onclick="showWorkout('UA')">Верх A</button><button id="uBBtn" onclick="showWorkout('UB')">Верх B</button></div><div id="workout"></div></div></section>
<section id="basePage" class="hidden"><div class="card"><h2 style="margin-top:0">База упражнений</h2><input class="search" id="search" placeholder="Поиск: ягодицы, спина, гантели…" oninput="renderBase()"><div id="base"></div></div></section>
<section id="histPage" class="hidden"><div class="card"><h2 style="margin-top:0">История</h2><div id="history"></div></div></section>
</main>
<script>
const programs={
UA:{title:'ВЕРХ A',goal:'Спина • грудь • плечи • бицепс • трицепс',items:[
['Тяга гантели одной рукой','3 × 8–12 / рука','8–12 кг','Спина, широчайшие','тяга'],['Жим гантелей лёжа','3 × 8–12','5–7 кг × 2','Грудь, трицепс','жим'],['Махи гантелями в стороны','3 × 12–15','2–4 кг × 2','Средняя дельта','махи'],['Сгибание рук со штангой сидя','2 × 8–12','7–10 кг общий','Бицепс','бицепс'],['Разгибание штанги из-за головы','2 × 10–12','8 кг','Трицепс','трицепс']]},
UB:{title:'ВЕРХ B',goal:'Спина • грудь • плечи • задняя дельта • бицепс',items:[
['Вертикальная тяга резинки сверху к груди','3 × 8–12','по уровню резинки','Широчайшие, верх спины, бицепс','тяга'],['Отжимания от прямой скамьи','3 × 8–12','Вес тела','Грудь, трицепс, передняя дельта','отжимания'],['Жим гантелей сидя вверх','3 × 8–12','≈3 кг × 2','Плечи, трицепс','жим'],['Обратные разведения лёжа на животе','2 × 12–15','1–2 кг × 2','Задняя дельта, ромбовидные','разведения'],['Молотковые сгибания с гантелями','2 × 10–12','3–5 кг × 2','Бицепс, предплечье','бицепс']]},
A:{title:'НИЗ A',goal:'Ягодицы • задняя поверхность бедра',items:[
['Ягодичный мост со скамьёй (Hip Thrust)','3 × 8–12','стартовый ориентир 12–18 кг','Ягодицы, задняя поверхность бедра','мост'],['Румынская тяга со штангой','3 × 8–10','по текущему рабочему весу','Задняя поверхность бедра, ягодицы','тяга'],['Болгарский выпад с опорой','2 × 8–10 / нога','подбирается по технике','Ягодицы, квадрицепс','выпад'],['Мах назад на четвереньках с утяжелителем / резинкой','2 × 12–15 / нога','утяжелитель или резинка','Большая ягодичная','мах'],['Сгибание ног лёжа с утяжелителями','2–3 × 12–18','старт около 2,5 кг','Задняя поверхность бедра','сгибание']]},
B:{title:'НИЗ B',goal:'Ягодицы • квадрицепсы • средняя ягодичная',items:[
['Приседания со штангой','3 × 8–10','по текущему рабочему весу','Ягодицы, квадрицепсы','присед'],['Статический сплит-присед','2 × 8–10 / нога','подбирается по технике','Ягодицы, квадрицепсы','выпад'],['Зашагивания на скамью','2 × 8–10 / нога','по текущему рабочему весу','Ягодицы, квадрицепсы','зашаг'],['Отведение ноги лёжа на боку с утяжелителем','2–3 × 12–18 / нога','начать примерно 1–1,5 кг','Средняя ягодичная','отведение'],['Frog pumps с резинкой','2 × 15–20','резинка','Ягодицы','мост']]}
};
const all=[...new Set(Object.values(programs).flatMap(p=>p.items.map(x=>x[0])))].map(name=>{let x=Object.values(programs).flatMap(p=>p.items).find(x=>x[0]===name);return {name,sets:x[1],weight:x[2],muscle:x[3],kind:x[4]}});
function svg(kind){const base=`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="48" fill="#efe5f5"/><circle cx="60" cy="32" r="10" fill="#6f2dbd"/><path d="M60 43 L60 75 M60 52 L38 63 M60 52 L82 63 M60 75 L45 96 M60 75 L75 96" stroke="#6f2dbd" stroke-width="6" stroke-linecap="round" fill="none"/>`;
let extra=''; if(['тяга','бицепс'].includes(kind)) extra='<path d="M32 62 L50 70" stroke="#9b4de3" stroke-width="7" stroke-linecap="round"/><circle cx="29" cy="61" r="5" fill="#9b4de3"/><path d="M76 62 L91 55" stroke="#9b4de3" stroke-width="7" stroke-linecap="round"/>'; if(kind==='жим') extra='<path d="M42 58 L78 58" stroke="#9b4de3" stroke-width="5"/><path d="M36 58 L84 58" stroke="#6f2dbd" stroke-width="2"/>'; if(['присед','выпад','зашаг','мост','сгибание','отведение','мах'].includes(kind)) extra='<path d="M45 96 L37 82 M75 96 L83 82" stroke="#9b4de3" stroke-width="7" stroke-linecap="round"/>'; return base+extra+'</svg>'}
function page(x){['today','train','base','hist'].forEach(k=>document.getElementById(k+'Page').classList.toggle('hidden',k!==x));['tToday','tTrain','tBase','tHist'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById({today:'tToday',train:'tTrain',base:'tBase',hist:'tHist'}[x]).classList.add('active');if(x==='base')renderBase();if(x==='hist')renderHistory();}
function showWorkout(type){document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('active'));const map={A:'aBtn',B:'bBtn',UA:'uABtn',UB:'uBBtn'};document.getElementById(map[type]).classList.add('active');const p=programs[type];let out=`<h2 style="margin:0">${p.title}</h2><div class="meta">${p.goal}</div>`;p.items.forEach((x,i)=>out+=`<div class="exercise"><div class="exgrid"><div class="pic">${svg(x[4])}</div><div><h3>${i+1}. ${x[0]}</h3><div class="meta"><b>Подходы:</b> ${x[1]}<br><b>Ориентир:</b> ${x[2]}<br><b>Работают:</b> ${x[3]}</div><div class="row"><input id="${type}w${i}" type="number" step="0.1" placeholder="факт. вес"><input id="${type}r${i}" type="number" placeholder="повторы"></div></div></div></div>`);out+=`<div class="row"><button class="primary" onclick="saveWorkout('${type}')">Сохранить тренировку</button></div><div id="${type}saved" class="saved hidden">Сохранено.</div>`;document.getElementById('workout').innerHTML=out}
function saveWorkout(type){const data=programs[type].items.map((x,i)=>({name:x[0],weight:document.getElementById(type+'w'+i).value,reps:document.getElementById(type+'r'+i).value}));localStorage.setItem('wt-'+todayKey(),JSON.stringify({type,title:programs[type].title,data}));document.getElementById(type+'saved').classList.remove('hidden');}
function todayKey(){return new Date().toISOString().slice(0,10)}
function saveDay(){localStorage.setItem('day-'+todayKey(),JSON.stringify({weight:weight.value,steps:steps.value,eaten:eaten.value,burned:burned.value,protein:protein.value,fat:fat.value,carbs:carbs.value}));savedMsg.textContent='Сохранено';}
function clearDay(){['weight','steps','eaten','burned','protein','fat','carbs'].forEach(id=>document.getElementById(id).value='');savedMsg.textContent=''}
function loadDay(){let d=JSON.parse(localStorage.getItem('day-'+todayKey())||'null');if(d)Object.keys(d).forEach(k=>document.getElementById(k).value=d[k]||'')}
function renderBase(){let q=(document.getElementById('search').value||'').toLowerCase();let arr=all.filter(x=>(x.name+' '+x.muscle+' '+x.weight).toLowerCase().includes(q));document.getElementById('base').innerHTML=arr.length?arr.map((x,i)=>`<div class="exercise"><div class="exgrid"><div class="pic">${svg(x.kind)}</div><div><h3>${x.name}</h3><span class="badge">${x.muscle}</span><span class="badge">${x.weight}</span><div class="meta" style="margin-top:7px"><b>Работа:</b> ${x.sets}</div></div></div></div>`).join(''):'<div class="empty">Ничего не найдено.</div>'}
function renderHistory(){let keys=Object.keys(localStorage).filter(k=>k.startsWith('wt-')||k.startsWith('day-')).sort().reverse();if(!keys.length){document.getElementById('history').innerHTML='<div class="empty">Пока нет сохранённых тренировок.</div>';return}document.getElementById('history').innerHTML=keys.map(k=>{let d=JSON.parse(localStorage.getItem(k));return `<div class="historyitem"><b>${k.slice(3)}</b> — ${d.title||'Дневник'}</div>`}).join('')}
document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});loadDay();showWorkout('A');
</script></body></html>
